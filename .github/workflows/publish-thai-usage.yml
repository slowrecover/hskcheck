name: Publish queued Thai grammar guides

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hskcheck-thai-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publish next reviewed Thai search-intent guide
        run: python3 tools/th_publish_next.py
      - name: Commit generated HTML and sitemap if changed
        run: |
          git add data/th/usage_published.txt th/ sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing new to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content(th): publish next reviewed Thai grammar page"
          git push
